# Runs the site's updaters every night in GitHub's cloud and commits what changed.
# The web server only needs `git pull` (see README), so it needs no Python packages or admin rights.
name: Nightly update

on:
  schedule:
    - cron: "17 11 * * *"          # 03:17 Pacific standard time (GitHub runs schedules in UTC)
  workflow_dispatch:                # "Run workflow" button on the Actions tab
    inputs:
      max_papers:
        description: "Papers to process in this run (raise it, e.g. to 300, for a backfill)"
        default: "40"
      papers:
        description: "Optional: arXiv numbers to (re)process now, separated by spaces"
        default: ""

permissions:
  contents: write                   # to commit the updated data files

concurrency:
  group: site-data                  # never at the same time as publishing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the figure reader and Ghostscript (for EPS figures)
        run: |
          pip install pymupdf==2.1
          sudo apt-get install -y -q ghostscript > /dev/null

      - name: Publications
        run: python3 tools/update_site_data.py || echo "::warning::publication update failed; the existing files were kept"

      - name: Dark matter limits, committed in batches so reviewing can start straight away
        env:
          PAPERS: ${{ inputs.papers }}
          MAX_PAPERS: ${{ inputs.max_papers || '100' }}
          BATCH: "10"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit and push. If a review was published meanwhile, limits.py merges the two record by
          # record, and every later run of limits.py starts from the merged data, so no review is lost.
          push_changes () { python3 tools/limits.py publish --bot -m "$1" || exit 1; }
          push_changes "Nightly update: publications"
          if [ -n "$PAPERS" ]; then
            # only arXiv numbers, never anything else, reach the command line
            ids=$(echo "$PAPERS" | grep -oE '[0-9]{4}\.[0-9]{4,5}' | tr '\n' ' ')
            python3 tools/limits.py extract $ids
            push_changes "Re-extract papers: $ids"
            exit 0
          fi
          case "$MAX_PAPERS" in (*[!0-9]*|'') MAX_PAPERS=40;; esac
          python3 tools/limits.py update --max-papers 0          # find new papers only
          push_changes "Nightly update: new papers found"
          done=0
          while [ "$done" -lt "$MAX_PAPERS" ] && [ "$(python3 tools/limits.py waiting)" -gt 0 ]; do
            python3 tools/limits.py update --skip-scrape --max-papers "$BATCH"
            done=$((done + BATCH))
            push_changes "Nightly update: curves from up to $done papers"
          done
          echo "Processed up to $done papers; $(python3 tools/limits.py waiting) still waiting."
