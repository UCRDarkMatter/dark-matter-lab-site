# After someone publishes review changes (tools/limits.sql), rebuild the file the public page reads.
name: Publish curves

on:
  push:
    branches: [main]
    paths: [tools/limits.sql]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data                  # never at the same time as the nightly update
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild data/limits.json from the database
        run: python3 tools/limits.py export
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/limits.json tools/limits.sql
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "Publish reviewed dark matter limit curves"
          for attempt in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 15
          done
          exit 1
