# One-time helper: downloads the funder logo SVGs from Wikimedia Commons onto the branch
# "logo-import", so they can be cleaned up and added to images/funders/. Remove after use.
name: Fetch funder logos (one-time)

on:
  push:
    branches: [main]
    paths: [.github/workflows/fetch-logos.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download from Wikimedia Commons
        run: |
          mkdir -p /tmp/logos && cd /tmp/logos
          UA="UCRDarkMatterLabSite/1.0 (https://github.com/UCRDarkMatter/dark-matter-lab-site)"
          for f in NSF.svg Seal_of_the_Department_of_Energy.svg University_of_California_logo.svg Seal_of_the_United_States_Department_of_Education.svg; do
            curl -sSfL -A "$UA" -o "$f" "https://commons.wikimedia.org/wiki/Special:FilePath/$f"
            head -c 200 "$f" | grep -qi "<svg\|<?xml" || { echo "not an SVG: $f"; exit 1; }
            echo "$f $(wc -c < "$f") bytes"
          done
      - name: Commit to the logo-import branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan logo-import
          git rm -rq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/logos/*.svg .
          git add *.svg
          git commit -q -m "Funder logo SVGs from Wikimedia Commons"
          git push -q -f origin logo-import
